[pytest]
addopts = -q --showlocals --alluredir=reports/allure-results --headed -n auto --reruns 2 --reruns-delay 1
testpaths = tests
python_files = test_*.py
pythonpath = .
markers =
    smoke: Mark test as smoke test (quick validation)
    regression: Mark test as regression test (full test suite)
    slow: Mark test as slow running
    e2e: Mark test as end-to-end test